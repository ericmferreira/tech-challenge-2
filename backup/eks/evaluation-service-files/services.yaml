apiVersion: v1
kind: Service
metadata:
  name: evaluation-service-redis
spec:
  selector:
    app: evaluation-service-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service-app
spec:
  selector:
    app: evaluation-service-app
  ports:
    - protocol: TCP
      port: 8004
      targetPort: 8004
  type: ClusterIP