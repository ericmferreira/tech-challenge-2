apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service-database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service-database
  template:
    metadata:
      labels:
        app: flag-service-database
    spec:
      containers:
        - name: postgres
          image: postgres:13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: FLAG_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: FLAG_POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: FLAG_POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "5432"
            periodSeconds: 5                  
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: flag-db-pvc
        - name: init-script
          configMap:
            name: flag-db-init-script
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flag-service-app
  template:
    metadata:
      labels:
        app: flag-service-app
    spec:
      containers:
        - name: flag-service-app
          image: 870737143013.dkr.ecr.us-east-2.amazonaws.com/togglemaster/flag-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: flag-service-config
            - secretRef:
                name: secrets-togglemaster
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: FLAG_DATABASE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: flag-service-config
                  key: AUTH_SERVICE_URL            
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5 # Aumentado de 1 para 5 segundos
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5 # Aumentado de 1 para 5 segundos
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"