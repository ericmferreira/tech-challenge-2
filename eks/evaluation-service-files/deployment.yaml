apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-service
  namespace: togglemaster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service-redis
  template:
    metadata:
      labels:
        app: evaluation-service-redis
        namespace: togglemaster
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service-app
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-service-app
  template:
    metadata:
      labels:
        app: evaluation-service-app
    spec:
      serviceAccountName: evaluation-service
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z evaluation-service-redis 6379; do
                echo "Aguardando Redis..."
                sleep 2
              done
              echo "Redis acessível."    
      containers:
        - name: evaluation-service-app
          image: 870737143013.dkr.ecr.us-east-2.amazonaws.com/togglemaster/evaluation-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: evaluation-service-config
          env:
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: EVALUATION_TM_KEY
          startupProbe:
            httpGet:
              path: /health
              port: 8004
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30    
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5 # Aumentado de 1 para 5 segundos
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5 # Aumentado de 1 para 5 segundos
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"