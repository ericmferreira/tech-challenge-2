apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service-database
  template:
    metadata:
      labels:
        app: auth-service-database
    spec:
      containers:
        - name: postgres
          image: postgres:13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: AUTH_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: AUTH_POSTGRES_PWD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: AUTH_POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "5432"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30                  
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: auth-db-pvc
        - name: init-script
          configMap:
            name: auth-db-init-script
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service-app
  template:
    metadata:
      labels:
        app: auth-service-app
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z auth-service-database 5432; do
                echo "Aguardando PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL acessível."  
      containers:
        - name: auth-service-app
          image: 870737143013.dkr.ecr.us-east-2.amazonaws.com/togglemaster/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: secrets-togglemaster
          env:
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: MASTER_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: AUTH_DATABASE_URL
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30                  
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5 # Aumentado de 1 para 5 segundos
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5 # Aumentado de 1 para 5 segundos
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"