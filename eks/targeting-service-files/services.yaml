apiVersion: v1
kind: Service
metadata:
  name: targeting-service-database
  namespace: togglemaster
spec:
  selector:
    app: targeting-service-database
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service-app
spec:
  selector:
    app: targeting-service-app
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
  type: ClusterIP