apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service-database
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service-database
  template:
    metadata:
      labels:
        app: targeting-service-database
    spec:
      containers:
        - name: postgres
          image: postgres:13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: TARGETING_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: TARGETING_POSTGRES_PWD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: TARGETING_POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: targeting-db-pvc
        - name: init-script
          configMap:
            name: targeting-db-init-script
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service-app
  namespace: togglemaster  
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting-service-app
  template:
    metadata:
      labels:
        app: targeting-service-app
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z targeting-service-database 5432; do
                echo "Aguardando PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL acessível."
      containers:
        - name: targeting-service-app
          image: 870737143013.dkr.ecr.us-east-2.amazonaws.com/togglemaster/targeting-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: targeting-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: TARGETING_DATABASE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: targeting-service-config
                  key: AUTH_SERVICE_URL                  
          startupProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5 # Aumentado de 1 para 5 segundos
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5 # Aumentado de 1 para 5 segundos
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"