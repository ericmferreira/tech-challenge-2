apiVersion: v1
kind: Secret
metadata:
  name: secrets-togglemaster
  namespace: togglemaster
type: Opaque
stringData:
  # AUTH SERVICE + AUTH POSTGRESQL
  AUTH_POSTGRES_USER: "auth_user"
  AUTH_POSTGRES_PWD: "CHANGE_ME_AUTH_DB_PASSWORD"
  AUTH_POSTGRES_DB: "auth_db"
  AUTH_DATABASE_URL: "postgres://auth_user:CHANGE_ME_AUTH_DB_PASSWORD@auth-service-database:5432/auth_db"
  MASTER_KEY: "CHANGE_ME_TO_A_LONG_RANDOM_MASTER_KEY"

  # FLAG POSTGRESQL
  FLAG_POSTGRES_USER: "flag_user"
  FLAG_POSTGRES_PASSWORD: "CHANGE_ME_FLAG_DB_PASSWORD"
  FLAG_POSTGRES_DB: "flag_db"
  FLAG_DATABASE_URL: "postgres://flag_user:CHANGE_ME_FLAG_DB_PASSWORD@flag-service-database:5432/flag_db"

  # TARGETING POSTGRESQL
  TARGETING_POSTGRES_USER: "targeting_user"
  TARGETING_POSTGRES_PWD: "CHANGE_ME_TARGETING_DB_PASSWORD"
  TARGETING_POSTGRES_DB: "targeting_db"
  TARGETING_DATABASE_URL: "postgres://targeting_user:CHANGE_ME_TARGETING_DB_PASSWORD@targeting-service-database:5432/targeting_db"

  # Created automatically by deploy-applications.ps1 after Auth Service is healthy.
  EVALUATION_TM_KEY: "GENERATED_BY_DEPLOY_SCRIPT"
