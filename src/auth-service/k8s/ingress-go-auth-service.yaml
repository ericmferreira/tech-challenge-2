apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-go-auth-service
  labels:
    app.kubernetes.io/name: ingress-go-auth-service
spec:
  ingressClassName: nginx
  rules:
  - host: auth-service.local
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: service-go-auth-service
            port: 
              number: 8001
