apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-psql-auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: psql-auth-service
          image: postgres:15.3
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: secrets-k8s-auth-service
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-k8s-auth-service
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: secrets-k8s-auth-service
                  key: POSTGRES_DB
          resources:
            limits:
              memory: "512Mi"
              cpu: "1000m"
            requests:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: pvc-psql-auth-service
        - name: init-script
          configMap:
            name: configmap-psql-auth-service