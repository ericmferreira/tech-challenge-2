apiVersion: v1
kind: Service
metadata:
  name: flag-service-database
spec:
  selector:
    app: flag-service-database
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service-app
spec:
  selector:
    app: flag-service-app
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP