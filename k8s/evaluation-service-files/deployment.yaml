apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service-redis
  template:
    metadata:
      labels:
        app: evaluation-service-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30            
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-service-app
  template:
    metadata:
      labels:
        app: evaluation-service-app
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z evaluation-service-redis 6379; do
                echo "Aguardando Redis..."
                sleep 2
              done
              echo "Redis acessível."    
      containers:
        - name: evaluation-service-app
          image: evaluation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: evaluation-service-config
            - secretRef:
                name: secrets-togglemaster
          env:
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets-togglemaster
                  key: EVALUATION_TM_KEY
          startupProbe:
            httpGet:
              path: /health
              port: 8004
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30    
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5 # Aumentado de 1 para 5 segundos
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5 # Aumentado de 1 para 5 segundos
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"