apiVersion: v1
kind: Secret
metadata:
  name: secrets-togglemaster
type: Opaque
stringData:
  ## GENERAL
  AWS_SQS_URL: "<VARIABLE_VALUE>"
  AWS_ACCESS_KEY_ID: "<VARIABLE_VALUE>"
  AWS_SECRET_ACCESS_KEY: "<VARIABLE_VALUE>"
  AWS_REGION: "<VARIABLE_VALUE>"

  ### ANALYTICS SERVICE
  ANALYTICS_TM_KEY: "<VARIABLE_VALUE>"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"

  ### AUTH SERVICES
  AUTH_POSTGRES_USER: "auth_user"
  AUTH_POSTGRES_PWD: "password"
  AUTH_POSTGRES_DB: "auth_db"
  AUTH_DATABASE_URL: "postgres://auth_user:password@auth-service-database:5432/auth_db"
  MASTER_KEY: "<VARIABLE_VALUE>"

  ### EVALUATION SERVICES
  EVALUATION_TM_KEY: "<VARIABLE_VALUE>"

  ### TARGETING SERVICE
  TARGETING_TM_KEY: ""
  TARGETING_POSTGRES_USER: "auth_user"
  TARGETING_POSTGRES_PWD: "password"
  TARGETING_POSTGRES_DB: "auth_db"
  TARGETING_DATABASE_URL: "postgres://targeting_user:password@targeting-service-database:5432/targeting_db"

  ### FLAG SERVICE
  FLAG_TM_KEY: "<VARIABLE_VALUE>"
  FLAG_POSTGRES_USER: "flag_user"
  FLAG_POSTGRES_PASSWORD: "password"
  FLAG_POSTGRES_DB: "flag_db"
  FLAG_DATABASE_URL: "DATABASE_URL: postgres://flag_user:password@flag-service-database:5432/flag_db"
